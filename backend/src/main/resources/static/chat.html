<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plata · Messages</title>
    <link rel="stylesheet" href="css/app.css">
</head>
<body>
<header class="topbar">
    <p class="brand">Plata</p>
    <div class="spacer"></div>
    <a class="linkish" href="dashboard.html">Wallet</a>
    <span class="who" id="who"></span>
    <button type="button" class="linkish" id="logout">Log out</button>
</header>

<main class="wrap chat-wrap">
    <p class="alert error" id="pageError" hidden></p>

    <div class="chat">
        <aside class="contacts" id="contacts">
            <div class="skeleton"></div>
        </aside>

        <section class="thread">
            <div class="thread-header" id="threadHeader">Select someone to message</div>
            <div class="thread-messages" id="threadMessages"></div>
            <form id="sendForm" class="thread-input">
                <input id="messageInput" type="text" placeholder="Type a message…" autocomplete="off" disabled>
                <button type="submit" id="sendButton" disabled>Send</button>
            </form>
        </section>
    </div>
</main>

<script src="js/api.js"></script>
<script src="js/chat.js"></script>
</body>
</html>
