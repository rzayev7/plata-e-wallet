<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plata · Sign up</title>
    <link rel="stylesheet" href="css/auth.css">
</head>
<body>
<main class="card">
    <p class="brand">Plata</p>
    <h1>Create account</h1>

    <p class="alert error" id="error" hidden></p>

    <form id="form">
        <div class="row">
            <div class="field">
                <label for="firstName">First name</label>
                <input type="text" id="firstName" name="firstName" autocomplete="given-name" required>
            </div>
            <div class="field">
                <label for="lastName">Last name</label>
                <input type="text" id="lastName" name="lastName" autocomplete="family-name" required>
            </div>
        </div>

        <div class="field">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" autocomplete="email" required>
        </div>

        <div class="field">
            <label for="phoneNumber">Phone number</label>
            <input type="tel" id="phoneNumber" name="phoneNumber" autocomplete="tel">
        </div>

        <div class="field">
            <label for="rawPassword">Password</label>
            <input type="password" id="rawPassword" name="rawPassword" autocomplete="new-password" minlength="8" required>
        </div>

        <button type="submit" id="submit">Sign up</button>
    </form>

    <p class="switch">Already have an account? <a href="login.html">Log in</a></p>
</main>

<script src="js/api.js"></script>
<script src="js/register.js"></script>
</body>
</html>
