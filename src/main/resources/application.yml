spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: plata

  datasource:
    url: jdbc:postgresql://localhost:5432/plata
    username: postgres
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration-minutes: 15
  refresh-token-expiration-days: 30

logging:
  level:
    org.springframework.security: DEBUG