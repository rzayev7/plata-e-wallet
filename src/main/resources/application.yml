spring:
  application:
    name: plata
  jpa:
    hibernate:
      ddl-auto: validate   # schema is owned by Flyway, never let Hibernate auto-generate it
    open-in-view: false     # avoid the lazy-loading-in-controller antipattern
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration-minutes: 15
  refresh-token-expiration-days: 30